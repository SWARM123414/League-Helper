<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>LoL Scout</title>
</head>
<body>
  <!-- A barra de cima é a barra da janela: arrasta-se por ela e tem os botões da janela à direita -->
  <header class="topbar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <div class="logo"><span>◆</span></div>
      <div data-tauri-drag-region>
        <div class="brand-name" data-tauri-drag-region>LOL SCOUT</div>
        <div class="brand-sub" id="status" data-tauri-drag-region></div>
      </div>
    </div>
    <nav class="tabs" id="tabs" data-tauri-drag-region>
      <button data-tab="match" class="active" data-i18n="tab.match">Partida</button>
      <button data-tab="builds" data-i18n="tab.builds">Builds</button>
      <button data-tab="history" data-i18n="tab.history">Histórico</button>
      <button data-tab="notes" data-i18n="tab.notes">Notas</button>
      <button data-tab="settings" data-i18n="tab.settings">Definições</button>
    </nav>
    <select id="lang-select" class="lang-select" title="Idioma / Language"></select>
    <div class="me" id="me" data-tauri-drag-region></div>
    <div class="winctl">
      <button id="win-min" class="wc" aria-label="Minimizar" title="Minimizar">
        <svg viewBox="0 0 10 10"><path d="M1.5 5.5h7" /></svg>
      </button>
      <button id="win-max" class="wc" aria-label="Maximizar" title="Maximizar">
        <svg class="i-max" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" /></svg>
        <svg class="i-restore" viewBox="0 0 10 10"><path d="M3 3V1.5h5.5V7H7" /><rect x="1.5" y="3" width="5.5" height="5.5" /></svg>
      </button>
      <button id="win-close" class="wc close" aria-label="Fechar" title="Fechar">
        <svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" /></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="tab-match" class="tab active"></section>
    <section id="tab-builds" class="tab"></section>
    <section id="tab-history" class="tab"></section>
    <section id="tab-notes" class="tab"></section>
    <section id="tab-settings" class="tab"></section>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-box">
      <h3 id="modal-title">Nota</h3>
      <textarea id="modal-text" maxlength="500" data-i18n-ph="modal.ph"></textarea>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn ghost" data-i18n="modal.cancel">Cancelar</button>
        <button id="modal-save" class="btn" data-i18n="modal.save">Guardar</button>
      </div>
    </div>
  </div>

  <div class="modal hidden" id="profile">
    <div class="profile-box">
      <button class="btn small ghost profile-close" id="profile-close" data-i18n="prof.close">Fechar</button>
      <div id="profile-body"></div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
